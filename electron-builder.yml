appId: com.switchboard.irc
productName: Switchboard
# The database addon ships prebuilt for every platform it supports, as one
# Node-API binary that both Electron and the test runner can load. Left to
# itself electron-builder would try to compile it, which needs a C++ toolchain
# on every runner to arrive at the same thing.
npmRebuild: false
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintrc,.prettierrc,tsconfig.*}'
  - '!{PLAN,README}.md'
  # The Android client is a separate build; its Gradle output is hundreds of
  # megabytes and has no business inside the desktop app.
  - '!android/*'
  - '!docs/*'
  - '!tests/*'
  - '!images/*'
asarUnpack:
  - resources/**
  - node_modules/sql.js/dist/**
  # SQLite, with the encryption. A .node cannot be loaded from inside the asar
  # archive, and this one is loaded before the first window exists — packed in,
  # the app does not start at all.
  - node_modules/better-sqlite3-multiple-ciphers/**
  # iroh ships a native .node per platform; it cannot be loaded from inside the
  # asar archive, and the remote link silently disappears if it is not unpacked.
  - node_modules/@number0/**
icon: resources/icon.png
mac:
  files:
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{linux,linuxmusl,win32}-*'
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
linux:
  files:
    # The database addon ships a prebuild per platform, and seven of the eight
    # are 20MB of dead weight in any one build. Both linux variants stay: the
    # loader picks between glibc and musl at run time, and an AppImage can
    # land on either.
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,win32}-*'
  # A directory of PNGs (16x16 … 512x512) — electron-builder installs each into the
  # matching /usr/share/icons/hicolor/<size>/apps dir. A single large PNG lands in
  # hicolor/1024x1024, which is not a size the icon theme spec indexes, so desktops
  # find no icon at all for the .desktop entry.
  icon: resources/icons
  target:
    - AppImage
    - deb
    - rpm
  maintainer: switchboard-irc
  category: Network;Chat;IRCClient
win:
  files:
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux,linuxmusl}-*'
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: KaraZajac
  repo: switchboard
