appId: com.switchboard.irc
productName: Switchboard
# The database addon ships prebuilt for every platform it supports, as one
# Node-API binary that both Electron and the test runner can load. Left to
# itself electron-builder would try to compile it, which needs a C++ toolchain
# on every runner to arrive at the same thing.
npmRebuild: false
directories:
  buildResources: resources
  output: dist
asarUnpack:
  - resources/**
  - node_modules/sql.js/dist/**
  # SQLite, with the encryption. A .node cannot be loaded from inside the asar
  # archive, and this one is loaded before the first window exists — packed in,
  # the app does not start at all.
  - node_modules/better-sqlite3-multiple-ciphers/**
  # iroh ships a native .node per platform; it cannot be loaded from inside the
  # asar archive, and the remote link silently disappears if it is not unpacked.
  - node_modules/@number0/**
icon: resources/icon.png
# There is deliberately no top-level `files` list. The packer normalises that
# list into a filter object and turns it into a *second* matcher, separate from
# the one it decorates with `**/*` and its own ignores — and a matcher made of
# nothing but exclusions is treated as "everything except". The result was the
# entire checkout inside the app archive: `.git`, `src`, `tests`, the Android
# sources, the screenshots, and on CI the unpacked Electron it had just written
# to `dist/`. Every published build up to 2.3.0-beta shipped that way, which is
# why the installers kept growing.
#
# The platform lists are what the packer builds its main matcher from, so the
# include list lives there, three times over: the compiled app, the resources
# the tray and app icons are read from at run time, and the manifest. The
# packer adds the production node_modules on its own.
mac:
  files:
    - out/**/*
    - resources/**/*
    - package.json
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{linux,linuxmusl,win32}-*'
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
linux:
  files:
    - out/**/*
    - resources/**/*
    - package.json
    # The database addon ships a prebuild per platform, and seven of the eight
    # are 20MB of dead weight in any one build. Both linux variants stay: the
    # loader picks between glibc and musl at run time, and an AppImage can
    # land on either.
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,win32}-*'
  # A directory of PNGs (16x16 … 512x512) — electron-builder installs each into the
  # matching /usr/share/icons/hicolor/<size>/apps dir. A single large PNG lands in
  # hicolor/1024x1024, which is not a size the icon theme spec indexes, so desktops
  # find no icon at all for the .desktop entry.
  icon: resources/icons
  target:
    - AppImage
    - deb
    - rpm
  maintainer: switchboard-irc
  category: Network;Chat;IRCClient
win:
  files:
    - out/**/*
    - resources/**/*
    - package.json
    - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux,linuxmusl}-*'
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # No spaces in the name, because two different things normalise them and
  # they disagree. The default is `${productName} Setup ${version}.${ext}` —
  # "Switchboard Setup 2.8.4.exe" — and `latest.yml`, which is what the Windows
  # updater reads, gets the hyphenated spelling electron-builder's own uploader
  # would have used. Uploading with `gh` instead turns the spaces into dots, so
  # the manifest pointed at a file that did not exist and v2.8.4 shipped with
  # no way for Windows to update itself. The mac and Linux artifacts never had
  # the problem because their names never had spaces.
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: KaraZajac
  repo: switchboard
