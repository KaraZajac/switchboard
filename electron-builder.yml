appId: com.switchboard.irc
productName: Switchboard
# The database addon is prebuilt and put in place by scripts/before-build.mjs,
# for the architecture being packaged. Left to itself electron-builder would
# try to compile it, which needs a C++ toolchain on every runner to arrive at
# the same binary.
npmRebuild: false
beforeBuild: scripts/before-build.mjs
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintrc,.prettierrc,tsconfig.*}'
  - '!{PLAN,README}.md'
  # The Android client is a separate build; its Gradle output is hundreds of
  # megabytes and has no business inside the desktop app.
  - '!android/*'
  - '!docs/*'
  - '!tests/*'
  - '!images/*'
  # The other runtime's and other arch's copies of the database addon: kept
  # beside the one in use so a swap needs no network, but only one of them is
  # ever the right one to ship.
  - '!node_modules/better-sqlite3-multiple-ciphers/build/Release/runtimes/**'
asarUnpack:
  - resources/**
  - node_modules/sql.js/dist/**
  # SQLite, with the encryption. A .node cannot be loaded from inside the asar
  # archive, and this one is loaded before the first window exists — packed in,
  # the app does not start at all.
  - node_modules/better-sqlite3-multiple-ciphers/**
  # iroh ships a native .node per platform; it cannot be loaded from inside the
  # asar archive, and the remote link silently disappears if it is not unpacked.
  - node_modules/@number0/**
icon: resources/icon.png
mac:
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
linux:
  # A directory of PNGs (16x16 … 512x512) — electron-builder installs each into the
  # matching /usr/share/icons/hicolor/<size>/apps dir. A single large PNG lands in
  # hicolor/1024x1024, which is not a size the icon theme spec indexes, so desktops
  # find no icon at all for the .desktop entry.
  icon: resources/icons
  target:
    - AppImage
    - deb
    - rpm
  maintainer: switchboard-irc
  category: Network;Chat;IRCClient
win:
  target:
    - target: nsis
      arch:
        - x64
  signingHashAlgorithms:
    - sha256
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: KaraZajac
  repo: switchboard
