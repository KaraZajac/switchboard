name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build macOS
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: macos-builds
          path: |
            dist/*.dmg
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build Windows
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/latest.yml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Debug-signed on purpose. There is no release keystore, and generating
      # one per run would sign every release with a different key — which
      # Android reads as a different app and refuses to install over the last
      # one. A debug build installs, and upgrades, and says what it is.
      - name: Build the Android client
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Name the APKs after the release
        run: |
          mkdir -p android-out
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-debug\.apk$//')
            cp "$apk" "android-out/switchboard-${{ github.ref_name }}-$abi.apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: android-builds
          path: android-out/*.apk

  # electron-builder publishes as it builds: `publish: github` in
  # electron-builder.yml plus a token on a tag means each desktop job uploads
  # into one draft release, with the blockmaps and `latest*.yml` that
  # auto-update needs. This job adds what electron-builder knows nothing about
  # — the APKs — and then takes the draft live.
  #
  # It used to be `softprops/action-gh-release`, which created a release of its
  # own for the same tag. Both then existed: the draft held every artifact and
  # the published one held none, and the published one is what the tag points
  # at. v1.2.0-beta shipped 6 of its 12 artifacts that way and nobody noticed,
  # because the run's only visible failure was in its last step.
  publish:
    needs: [build-macos, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Find the release electron-builder made
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name == "${{ github.ref_name }}")][0].id // empty')
          if [ -z "$id" ]; then
            # No desktop build published one — the APKs still deserve a release.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name='${{ github.ref_name }}' -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Add the Android builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload '${{ github.ref_name }}' artifacts/*.apk --clobber

      # Before taking it live rather than after. A release with nothing on it
      # is the failure this job exists to prevent, and checking afterwards
      # checks nothing: on v2.1.0-beta the step before this one failed, so this
      # was skipped — and the release was already public by then anyway.
      - name: Check it actually has the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" --jq '.assets|length')
          echo "$count assets on ${{ github.ref_name }}"
          [ "$count" -ge 8 ] || { echo "::error::only $count assets — expected the desktop builds and the APKs"; exit 1; }

      - name: Take it live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes are the tag's own message. `git tag -a` strips lines
          # beginning with `#` as comments unless the tag was made with
          # --cleanup=verbatim, which would quietly eat every markdown heading.
          git tag -l --format='%(contents)' '${{ github.ref_name }}' > notes.md
          [ -s notes.md ] || { echo "::error::no message on ${{ github.ref_name }} — annotate the tag"; exit 1; }

          # `-F key=@file` reads a file; `-f` does not, and takes the whole
          # thing as a literal key name. It was `-f body@notes.md`, which gh
          # rejected as `invalid key: "body@notes.md"` — so v2.1.0-beta went
          # out with no release notes and not marked as a prerelease.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" \
            -F draft=false \
            -F prerelease=${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }} \
            -F body=@notes.md \
            --jq '"published \(.html_url) with \(.assets|length) assets"'

      # Whoever publishes first wins, and it is not always this job: the draft
      # was already live before the APKs finished uploading. Say so rather than
      # leave a release that looks complete and is not.
      - name: Confirm what went out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" \
            --jq '"draft=\(.draft) prerelease=\(.prerelease) assets=\(.assets|length) notes=\(.body|length) bytes"'
          empty=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" --jq '.body|length')
          [ "$empty" -gt 0 ] || { echo "::error::published with no release notes"; exit 1; }
