name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build macOS
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: macos-builds
          path: |
            dist/*.dmg
            dist/*.blockmap
            dist/latest-mac.yml

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:linux -- --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: linux-builds
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest-linux.yml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build Windows
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: windows-builds
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Debug-signed on purpose. There is no release keystore, and generating
      # one per run would sign every release with a different key — which
      # Android reads as a different app and refuses to install over the last
      # one. A debug build installs, and upgrades, and says what it is.
      - name: Build the Android client
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Name the APKs after the release
        run: |
          mkdir -p android-out
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-debug\.apk$//')
            cp "$apk" "android-out/switchboard-${{ github.ref_name }}-$abi.apk"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: android-builds
          path: android-out/*.apk

  # One job uploads, and it is this one.
  #
  # electron-builder used to publish as it built — `publish: github` plus a
  # token on a tag — so four jobs uploaded into one release and this one added
  # the APKs. Two things were wrong with that, and v2.8.2 and v2.8.3 hit both
  # on the same day:
  #
  #  - **A transient upload failure lost the whole build.** GitHub answered 502
  #    partway through the 148 MB AppImage; electron-builder retried, gave up,
  #    and failed the job forty-seven minutes in, taking the deb, the rpm and
  #    the metadata down with it. Uploading afterwards makes that one short
  #    step, re-runnable on its own, against files that are already built.
  #  - **The release went live anyway.** electron-builder's publisher took it
  #    public as it went, and the check below — which exists precisely to stop
  #    a half-empty release — is in a job that `needs` all four builds, so a
  #    failed build *skips* it. The guard only ever guarded the happy path.
  #    v2.8.2 went out with no Android APKs at all and no `latest-linux.yml`,
  #    so the phone never saw that version and no Linux desktop could update to
  #    it. The same shape as v1.2.0-beta, which shipped 6 of its 12 artifacts,
  #    and the comment that used to be here described that bug while this one
  #    was still live.
  #
  # So the builds now run with `--publish never` and hand everything over as CI
  # artifacts — `latest*.yml` included, which electron-builder still writes
  # without a token. Nothing is public until every build has finished and the
  # count has been checked.
  publish:
    needs: [build-macos, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      # A draft, and nothing but a draft until the last step. Re-running this
      # job against a tag that already has one picks the same one up rather
      # than making a second.
      - name: A draft to fill
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.tag_name == "${{ github.ref_name }}")][0].id // empty')
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name='${{ github.ref_name }}' -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # `--clobber` so a re-run after a half-finished upload replaces what it
      # already put there rather than refusing.
      - name: Upload everything that was built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/
          gh release upload '${{ github.ref_name }}' artifacts/* --clobber

      # Before taking it live rather than after, and by name rather than by
      # count. Counting let v2.8.3 look healthy at eight assets while missing
      # every APK, the AppImage, and both files auto-update reads — three of
      # those eight were blockmaps. Each of these is something a person or an
      # updater goes looking for and finds nothing without.
      - name: Check what it actually has
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          have=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" --jq '.assets[].name')
          echo "$have"
          missing=
          for want in '\.AppImage$' '\.deb$' '\.rpm$' '\.exe$' '\.dmg$' \
                      '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' \
                      'arm64-v8a\.apk$' 'armeabi-v7a\.apk$' 'x86_64\.apk$' 'universal\.apk$'; do
            grep -qE "$want" <<<"$have" || missing="$missing $want"
          done
          [ -z "$missing" ] || { echo "::error::nothing matching:$missing"; exit 1; }

          # And that the update manifests point at files that are actually
          # here. `latest*.yml` names each artifact, and whoever uploads
          # decides how the name is spelled: electron-builder's own publisher
          # turned the spaces in "Switchboard Setup 2.8.4.exe" into hyphens,
          # `gh` turns them into dots, and the manifest was written by the
          # first. v2.8.4 shipped with a Windows manifest pointing at a file
          # that did not exist — every asset present, every kind accounted for,
          # and no way for Windows to update itself.
          for manifest in artifacts/latest*.yml; do
            [ -e "$manifest" ] || continue
            named=$(sed -nE 's/^[[:space:]]*-[[:space:]]*url:[[:space:]]*(.*)$/\1/p; s/^path:[[:space:]]*(.*)$/\1/p' "$manifest" | sort -u)
            for want in $named; do
              grep -qxF "$want" <<<"$have" ||
                missing="$missing $(basename "$manifest") wants $want;"
            done
          done
          [ -z "$missing" ] || { echo "::error::$missing"; exit 1; }

      - name: Take it live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The notes are the tag's own message, asked of GitHub rather than
          # of the checkout. `git tag -l --format=%(contents)` reads whatever
          # local ref actions/checkout left behind, and for a tag build that is
          # a lightweight one — so it silently gave the *commit* message
          # instead, and v2.1.1-beta shipped with the version-bump commit as
          # its release notes.
          #
          # Note for whoever writes the next tag: annotate it with
          # --cleanup=verbatim, or git strips every `#` heading as a comment.
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ github.ref_name }}")
          kind=$(jq -r '.object.type' <<<"$ref")
          if [ "$kind" != "tag" ]; then
            echo "::error::${{ github.ref_name }} is a lightweight tag — annotate it so it has notes"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$ref")" \
            --jq '.message' > notes.md
          [ -s notes.md ] || { echo "::error::no message on ${{ github.ref_name }} — annotate the tag"; exit 1; }

          # `-F key=@file` reads a file; `-f` does not, and takes the whole
          # thing as a literal key name. It was `-f body@notes.md`, which gh
          # rejected as `invalid key: "body@notes.md"` — so v2.1.0-beta went
          # out with no release notes and not marked as a prerelease.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" \
            -F draft=false \
            -F prerelease=${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }} \
            -F body=@notes.md \
            --jq '"published \(.html_url) with \(.assets|length) assets"'

      # Whoever publishes first wins, and it is not always this job: the draft
      # was already live before the APKs finished uploading. Say so rather than
      # leave a release that looks complete and is not.
      - name: Confirm what went out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" \
            --jq '"draft=\(.draft) prerelease=\(.prerelease) assets=\(.assets|length) notes=\(.body|length) bytes"'
          # Not just "is there a body": the last release had one and it was
          # the wrong text entirely. Check it is the tag's.
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ steps.release.outputs.id }}" --jq '.body')
          if [ -z "$published" ]; then
            echo "::error::published with no release notes"
            exit 1
          fi
          if [ "$published" != "$(cat notes.md)" ]; then
            echo "::error::the release notes are not the tag's message"
            exit 1
          fi
